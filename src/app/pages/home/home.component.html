<section
  id="top"
  class="relative min-h-[100svh] w-full flex items-center overflow-hidden bg-canvas m-0 px-0 py-28 sm:py-32 lg:py-0"
>
  <div class="absolute inset-0 z-0">
    <video
      #bgVideo
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      [muted]="true"
      class="w-full h-full object-cover opacity-70"
    >
      <source src="/video.MP4" type="video/MP4" />
    </video>
    <div
      class="absolute inset-0 bg-linear-to-b from-black/36 via-scroll-track/26 to-[#030504]/78"
    ></div>
    <div
      class="absolute inset-x-0 bottom-0 h-[42%] bg-linear-to-t from-[#010201]/96 via-[#041005]/78 via-55% to-transparent"
    ></div>
    <div
      class="absolute inset-x-0 bottom-0 h-56 bg-linear-to-t from-[#020403] via-[#071408]/68 to-transparent"
    ></div>
  </div>

  <div class="container mx-auto relative z-10 px-5 sm:px-6 md:px-16 text-left">
    <div class="max-w-6xl space-y-7 sm:space-y-10">
      <h1
        class="text-[clamp(3.2rem,9vw,9rem)] font-black text-white leading-[0.9] sm:leading-[0.86] tracking-tight md:tracking-tighter"
      >
        <span class="text-lime-400">{{ "HERO.TITLE_1" | translate }}</span
        ><br />
        {{ "HERO.TITLE_2" | translate }}<br />
        <span
          class="text-[clamp(2rem,4vw,3rem)] font-light opacity-70 italic tracking-normal"
          >{{ "HERO.TITLE_3" | translate }}</span
        >
      </h1>

      <p
        class="text-base sm:text-xl md:text-2xl text-gray-300 max-w-2xl font-light leading-relaxed border-l-2 border-lime-500/40 pl-4 sm:pl-6"
      >
        {{ "HERO.DESC_1" | translate }}
        <span class="text-white font-medium italic">{{
          "HERO.DESC_2" | translate
        }}</span
        >.
      </p>

      <div class="flex flex-col min-[430px]:flex-row flex-wrap gap-4 sm:gap-6 items-stretch min-[430px]:items-center pt-3 sm:pt-6">
        <button
          (click)="navigateTo('/contact')"
          class="px-7 sm:px-10 py-4 bg-lime-500 hover:bg-lime-400 text-black font-bold rounded-full transition-all hover:scale-105 shadow-[0_0_20px_rgba(154,203,147,0.35)] cursor-pointer"
        >
          {{ "HERO.BTN_START" | translate }}
        </button>
        <button
          (click)="navigateTo('/aboutus')"
          class="group flex items-center justify-center gap-3 px-7 sm:px-10 py-4 border border-white/20 hover:bg-white/10 text-white font-medium rounded-full transition-all backdrop-blur-sm cursor-pointer"
        >
          <span>{{ "HERO.BTN_STORY" | translate }}</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-4 h-4 group-hover:translate-x-2 transition-transform"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>

<div
  class="relative w-full bg-linear-to-b from-[#020403] via-[#071408] to-canvas-deep"
>
  <div
    class="absolute inset-x-0 top-0 h-72 bg-linear-to-b from-[#010201] via-[#020403]/96 via-25% via-[#071408]/78 to-transparent z-0 pointer-events-none"
  ></div>
  <div
    class="absolute inset-x-0 top-0 h-[30rem] bg-linear-to-b from-black/48 via-[#041005]/42 to-transparent z-0 pointer-events-none"
  ></div>
  <div class="absolute inset-0 z-0 pointer-events-none opacity-50">
    <app-energy-grid></app-energy-grid>
  </div>

  <div class="relative z-10">
    <section
      id="aboutus"
      class="relative m-0 p-0 overflow-clip bg-transparent"
    >
      <app-about-us></app-about-us>
    </section>

    <div
      class="w-full h-px bg-linear-to-r from-transparent via-lime-400/30 to-transparent"
    ></div>

    <section id="services" class="relative m-0 p-0 bg-transparent">
      <div class="container mx-auto py-16 sm:py-20 lg:py-24 px-5 sm:px-6">
        <app-services></app-services>
      </div>
    </section>

    <div
      class="w-full h-px bg-linear-to-r from-transparent via-lime-400/30 to-transparent"
    ></div>

    <section id="projects" class="relative m-0 p-0 bg-transparent">
      <div class="container mx-auto py-16 sm:py-20 lg:py-24 px-5 sm:px-6">
        <app-projects></app-projects>
      </div>
    </section>
  </div>
</div>

<app-innovation-well></app-innovation-well>

<section id="contact" class="relative bg-canvas m-0 p-0">
  <div class="container mx-auto py-16 sm:py-20 lg:py-24 px-5 sm:px-6 border-t border-white/10">
    <app-contact></app-contact>
  </div>
</section>

<button
  (click)="scrollToTop()"
  [class.opacity-100]="showScrollButton"
  [class.opacity-0]="!showScrollButton"
  class="fixed bottom-5 right-5 sm:bottom-8 sm:right-8 z-50 p-3 sm:p-4 rounded-2xl border border-white/15 bg-white/10 backdrop-blur-md text-white shadow-2xl transition-all duration-500 hover:bg-lime-500/20 hover:border-lime-500/40 group overflow-hidden cursor-pointer"
>
  <div
    class="absolute inset-0 bg-linear-to-tr from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"
  ></div>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="2.5"
    stroke="currentColor"
    class="w-6 h-6 relative z-10 group-hover:-translate-y-1 transition-transform"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M4.5 15.75l7.5-7.5 7.5 7.5"
    />
  </svg>
</button>

<app-scroll-guide></app-scroll-guide>
